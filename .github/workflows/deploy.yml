name: deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    environment: PROD
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
    
    - name: Pack
      run: dotnet pack src/NBomber.Sinks.InfluxDB/NBomber.Sinks.InfluxDB.csproj -c Release -o artifacts --include-source

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: Publish
      run: dotnet nuget push artifacts/**.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
